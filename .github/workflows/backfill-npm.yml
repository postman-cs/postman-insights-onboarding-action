name: Backfill npm

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Ordered space-separated immutable tags, oldest first
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Backfill immutable release artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"; fi
          PACKAGE_NAME='@postman/onboarding-insights'
          for TAG in $TAGS; do
            TAG_DIR="$(mktemp -d)"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'release.tgz' --dir "$TAG_DIR"
            TARBALL="$TAG_DIR/release.tgz"
            PACKAGE_JSON="$(tar -xOf "$TARBALL" package/package.json)"
            ACTUAL_NAME="$(node -e "const p=JSON.parse(process.argv[1]); process.stdout.write(p.name)" "$PACKAGE_JSON")"
            ACTUAL_VERSION="$(node -e "const p=JSON.parse(process.argv[1]); process.stdout.write(p.version)" "$PACKAGE_JSON")"
            if [ "$ACTUAL_NAME" != "$PACKAGE_NAME" ] || [ "$ACTUAL_VERSION" != "${TAG#v}" ]; then
              echo "::error::release asset $TAG has $ACTUAL_NAME@$ACTUAL_VERSION; refusing to republish an old-scope or mismatched asset"
              exit 1
            fi
            if npm view "$PACKAGE_NAME@$ACTUAL_VERSION" version >/dev/null 2>&1; then
              echo "::notice::$PACKAGE_NAME@$ACTUAL_VERSION already exists; skipping"
            else
              npm publish "$TARBALL" --provenance --access public --tag backfill
            fi
          done
          HIGHEST="$(npm view "$PACKAGE_NAME" versions --json | node -e "let data='';process.stdin.on('data', c => data += c).on('end', () => { const versions=JSON.parse(data); const list=Array.isArray(versions) ? versions : [versions]; const parse=v => v.split('.').map(Number); list.sort((a,b) => { const aa=parse(a), bb=parse(b); for(let i=0;i<3;i+=1){if((aa[i]??0)!==(bb[i]??0)) return (aa[i]??0)-(bb[i]??0);} return 0; }); process.stdout.write(list.at(-1) ?? ''); })")"
          if [ -z "$HIGHEST" ]; then
            echo '::error::no published versions found after backfill'
            exit 1
          fi
          npm dist-tag add "$PACKAGE_NAME@$HIGHEST" latest
